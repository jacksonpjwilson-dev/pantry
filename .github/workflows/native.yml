name: Native iOS
on:
  push:
    branches: ['native/**']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: xcode-cache
        with:
          path: native/DerivedData
          key: pantry-xcode-intel-${{ github.sha }}
          restore-keys: pantry-xcode-intel-
      - name: Core tests
        run: swift test --package-path native
      - name: Select simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PYTHON'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phone = next(d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('PANTRY_SIMULATOR=' + phone['udid'] + '\n')
          PYTHON
      - name: Build Apple simulator targets
        run: |
          set -o pipefail
          xcodebuild -project native/Pantry.xcodeproj -scheme Pantry -configuration Debug -derivedDataPath native/DerivedData -destination "id=$PANTRY_SIMULATOR" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-build.log
      - name: Launch native app and capture screenshot
        run: |
          xcrun simctl boot "$PANTRY_SIMULATOR" || true
          xcrun simctl bootstatus "$PANTRY_SIMULATOR" -b
          xcrun simctl install "$PANTRY_SIMULATOR" native/DerivedData/Build/Products/Debug-iphonesimulator/Pantry.app
          xcrun simctl launch "$PANTRY_SIMULATOR" dev.jacksonwilson.pantry
          sleep 5
          xcrun simctl io "$PANTRY_SIMULATOR" screenshot pantry-simulator.png
      - uses: actions/cache/save@v4
        if: always() && steps.xcode-cache.outputs.cache-hit != 'true'
        with:
          path: native/DerivedData
          key: pantry-xcode-intel-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: |
            native-build.log
            pantry-simulator.png
  firestore-rules:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/emulator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
