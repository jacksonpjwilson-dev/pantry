name: Native iOS
on:
  push:
    branches: ['native/**']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
concurrency:
  group: native-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: xcode-cache
        with:
          path: native/DerivedData
          key: pantry-xcode-intel-${{ github.sha }}
          restore-keys: pantry-xcode-intel-
      - name: Shared engine compatibility
        run: cmp engine.js native/Pantry/engine.js
      - name: Configuration regression tests
        run: python3 native/scripts/test_configuration.py
      - name: Core tests
        run: swift test --package-path native
      - name: Select simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PYTHON'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phone = next(d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('PANTRY_SIMULATOR=' + phone['udid'] + '\n')
          PYTHON
      - name: Build Apple simulator targets
        run: |
          set -o pipefail
          xcodebuild -project native/Pantry.xcodeproj -scheme Pantry -configuration Debug -derivedDataPath native/DerivedData -destination "id=$PANTRY_SIMULATOR" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee native-build.log
      - name: Prepare simulator for UI testing
        timeout-minutes: 10
        run: |
          set -o pipefail
          open -a Simulator --args -CurrentDeviceUDID "$PANTRY_SIMULATOR"
          xcrun simctl boot "$PANTRY_SIMULATOR" || true
          xcrun simctl bootstatus "$PANTRY_SIMULATOR" -b 2>&1 | tee simulator-boot.log
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        timeout-minutes: 10
        run: npm ci --prefix native/emulator --no-audit --no-fund
      - name: Test inventory, scanning and Firebase account interactions
        timeout-minutes: 24
        run: |
          cd native/emulator
          npx firebase emulators:exec --project demo-pantry-native --only auth,firestore 'node seed-ui.mjs && bash ../scripts/run-ui-tests.sh'
      - name: UI failure diagnostics
        if: failure() || cancelled()
        timeout-minutes: 3
        run: python3 native/scripts/simulator-diagnostics.py
      - name: Launch native app and capture screenshot
        run: |
          xcrun simctl boot "$PANTRY_SIMULATOR" || true
          xcrun simctl bootstatus "$PANTRY_SIMULATOR" -b
          xcrun simctl uninstall "$PANTRY_SIMULATOR" dev.jacksonwilson.pantry || true
          xcrun simctl install "$PANTRY_SIMULATOR" native/DerivedData/Build/Products/Debug-iphonesimulator/Pantry.app
          xcrun simctl launch "$PANTRY_SIMULATOR" dev.jacksonwilson.pantry
          sleep 5
          xcrun simctl io "$PANTRY_SIMULATOR" screenshot pantry-simulator.png
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: native-validation
          path: |
            native-build.log
            native-uitests.log
            native/TestResults/PantryUITests.xcresult
            pantry-simulator.png
            simulator-boot.log
            simulator-capture.log
            simulator-devices.log
            simulator-failure.png
            simulator-ui.log
            ui-summary.json
      - uses: actions/cache/save@v4
        if: success() && steps.xcode-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: native/DerivedData
          key: pantry-xcode-intel-${{ github.sha }}
  firestore-rules:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/emulator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
